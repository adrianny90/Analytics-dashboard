name: Keep backend awake

# Render's free tier suspends a web service after ~15 minutes with no
# inbound HTTP traffic, and only wakes it back up on the next request (a
# 30-60s+ cold start). A self-ping from inside the app can't prevent this -
# once the container is suspended, its own timers stop too - so this pings
# the public health endpoint from outside on a schedule tight enough to
# never let the idle timeout trigger.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 5 https://analytics-dashboard-5p9w.onrender.com/health
